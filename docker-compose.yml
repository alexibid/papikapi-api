services:
  papikapi-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: papikapi-api:latest
    container_name: papikapi-api
    restart: unless-stopped
    ports:
      - "4505:4505"
    environment:
      - PORT=4505
      - NODE_ENV=production
    volumes:
      - ../papikapi-studio/resources:/app/resources
      - ../papikapi-studio/public/models:/app/public/models
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4505/api/v1/hello').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
